name: Apply data-bot branch

# The backend data bot (RAM-cybe/dealscope) never writes to this repo's main
# and never puts a token in a clone URL. It pushes either:
#   price-sync/<run-id>  — daily market caps; this workflow opens a PR and
#                          squash-merges it (required reviews stay at 0)
#   promote/<run-id>     — quarterly fundamentals; same treatment. The backend
#                          has already sanitized the data and passed its own
#                          publish gate; this repo re-validates independently
#                          (scripts/validate_data.py) before merging.
#
# No human approval anywhere. After every merge a canary checks that the
# deployed site really shows the new dates; if it does not, the merge is
# reverted automatically and an issue is opened.
#
# Only the published data JSON files are allowed on these branches. Anything
# else fails the job instead of reaching main.

on:
  push:
    branches:
      - 'price-sync/**'
      - 'promote/**'
  # Self-healing: GitHub-hosted runners occasionally fail to start a job
  # ("job was not acquired by Runner"). When that hits the push-triggered run,
  # the branch is left with no PR and the backend's daily run fails. The hourly
  # sweep below (or a manual dispatch with a branch name) picks it back up.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'price-sync/* or promote/* branch to apply (blank = sweep)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  deployments: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      branches: ${{ steps.pick.outputs.branches }}
    steps:
      - name: Checkout
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick branches to apply
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          emit() { echo "branches=$(printf '%s\n' "$@" | jq -R . | jq -sc 'map(select(length>0))')" >> "$GITHUB_OUTPUT"; }

          if [[ "$EVENT" == "push" ]]; then emit "$PUSHED"; exit 0; fi
          if [[ -n "$REQUESTED" ]]; then
            if [[ ! "$REQUESTED" =~ ^(price-sync|promote)/[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Branch must look like price-sync/<id> or promote/<id>"; exit 1
            fi
            emit "$REQUESTED"; exit 0
          fi

          # Sweep. Every price-sync branch is a FULL daily snapshot, so only the
          # newest un-applied one is worth publishing; older orphans are
          # superseded and merging them could roll prices backwards.
          # promote/* is never auto-swept: a human merges those.
          git fetch --quiet origin '+refs/heads/price-sync/*:refs/remotes/origin/price-sync/*' || true
          PICK=""
          SEEN_NEWER=false
          while read -r B; do
            [[ -n "$B" ]] || continue
            STATE=$(gh pr list --head "$B" --state all --json state --jq '.[0].state // "NONE"')
            case "$STATE" in
              MERGED|CLOSED)
                echo "Deleting finished branch $B ($STATE)"
                git push origin --delete "$B" || true
                SEEN_NEWER=true ;;
              OPEN)
                echo "$B has an open PR; the apply job owns it."
                SEEN_NEWER=true ;;
              NONE)
                if [[ "$SEEN_NEWER" == true ]]; then
                  echo "Deleting superseded orphan $B"
                  git push origin --delete "$B" || true
                else
                  AGE=$(( $(date +%s) - $(git log -1 --format=%ct "origin/$B") ))
                  if (( AGE < 900 )); then
                    echo "$B is only ${AGE}s old; its push-triggered run is still in flight."
                  else
                    echo "Orphan to apply: $B (${AGE}s old, no PR)"
                    PICK="$B"
                  fi
                  SEEN_NEWER=true
                fi ;;
            esac
          done < <(git for-each-ref --sort=-committerdate --format='%(refname:strip=3)' refs/remotes/origin/price-sync/)
          emit "$PICK"

  apply:
    needs: discover
    if: needs.discover.outputs.branches != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover.outputs.branches) }}
    concurrency:
      group: apply-data-bot-${{ matrix.branch }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ matrix.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Verify only allowed data files changed vs main
        id: verify
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          if [[ ${#CHANGED[@]} -eq 0 ]]; then
            echo "No file differences vs origin/main — nothing to apply; removing the empty branch."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git push origin --delete "$BRANCH" || true
            exit 0
          fi
          echo "Changed files:"
          printf '  %s\n' "${CHANGED[@]}"
          allowed='^data/(companies|narratives|deals|filter-bands|sector-bands|dataset-meta)\.json$'
          for f in "${CHANGED[@]}"; do
            if [[ ! "$f" =~ $allowed ]]; then
              echo "::error::Unexpected path on data-bot branch: $f"
              echo "Only data/{companies,narratives,deals,filter-bands,sector-bands,dataset-meta}.json are allowed."
              exit 1
            fi
          done

          # Independent content validation. Both the script and the baseline
          # come from origin/main, never from the branch under test.
          rm -rf /tmp/trusted /tmp/base-data && mkdir -p /tmp/trusted /tmp/base-data
          git show origin/main:scripts/validate_data.py > /tmp/trusted/validate_data.py
          for f in companies deals narratives dataset-meta; do
            git show "origin/main:data/$f.json" > "/tmp/base-data/$f.json" 2>/dev/null || true
          done
          python3 /tmp/trusted/validate_data.py --candidate data --base /tmp/base-data
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request if missing
        id: pr
        if: steps.verify.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if gh pr view "$BRANCH" --json number --jq .number > /tmp/pr_number; then
            echo "PR already exists: $(cat /tmp/pr_number)"
          else
            if [[ "$BRANCH" == price-sync/* ]]; then
              TITLE="Daily price refresh: ${BRANCH#price-sync/}"
              BODY="Automated daily market-cap sync from RAM-cybe/dealscope. Fundamentals are unchanged. Safe to auto-merge. Source run: ${RUN_URL}"
            else
              TITLE="Promote fundamentals snapshot (${BRANCH#promote/})"
              BODY="Quarterly fundamentals promotion from RAM-cybe/dealscope. Sanitized and gated on the backend, independently validated here, auto-merged, then canary-checked on the live site. Source run: ${RUN_URL}"
            fi
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            gh pr view "$BRANCH" --json number --jq .number > /tmp/pr_number
          fi
          echo "number=$(cat /tmp/pr_number)" >> "$GITHUB_OUTPUT"

      - name: Auto-merge (validated data only)
        id: merge
        if: success() && steps.verify.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [[ -z "${PR}" ]]; then
            echo "::error::No pull request number from the previous step"
            exit 1
          fi
          for i in 1 2 3 4 5 6 7 8; do
            if gh pr merge "$PR" --squash --delete-branch; then
              echo "Merged PR #$PR"
              SHA=$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid')
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$i" -eq 8 ]]; then
              echo "::error::Could not merge PR #$PR after 8 attempts"
              exit 1
            fi
            echo "Merge not ready (attempt $i/8); waiting 5s"
            sleep 5
          done

      - name: Canary - wait for the production deployment
        id: deploy
        if: steps.merge.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          # Vercel reports each deployment back to GitHub as a deployment status.
          for i in $(seq 1 60); do
            ID=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&environment=Production" --jq '.[0].id // empty')
            if [[ -n "$ID" ]]; then
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses" --jq '.[0].state // "pending"')
              echo "Deployment $ID: $STATE (check $i/60)"
              case "$STATE" in
                success) echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
                failure|error) echo "::error::Production deployment $ID ended in $STATE"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              esac
            else
              echo "No production deployment for ${SHA:0:7} yet (check $i/60)"
            fi
            sleep 20
          done
          # Slow is not broken: do not roll back good data over a slow deploy.
          echo "ok=unknown" >> "$GITHUB_OUTPUT"
          echo "::error::No production deployment result within 20 minutes (not rolled back)"
          exit 1

      - name: Canary - the live site must show the new dates
        id: canary
        if: steps.deploy.outputs.ok == 'true'
        env:
          SITE_URL: https://dealscope-screener.vercel.app/
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git show origin/main:data/dataset-meta.json > /tmp/meta.json
          for i in $(seq 1 15); do
            curl -fsS --max-time 30 "${SITE_URL}?canary=${GITHUB_RUN_ID}-${i}" -o /tmp/page.html || true
            if python3 scripts/canary_check.py /tmp/meta.json /tmp/page.html; then
              echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 20
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Roll back the merge if the deploy or canary failed
        if: ${{ always() && steps.merge.outputs.sha != '' && (steps.deploy.outputs.ok == 'false' || steps.canary.outputs.ok == 'false') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.merge.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --quiet
          git checkout -q -B "rollback/${SHA:0:7}" origin/main
          git revert --no-edit "$SHA"
          git push origin "rollback/${SHA:0:7}"
          gh pr create --base main --head "rollback/${SHA:0:7}" \
            --title "Rollback: ${SHA:0:7} failed its post-deploy canary" \
            --body "Automatic rollback. The deployment or live-site check for ${SHA} failed. Run: ${RUN_URL}"
          for _ in 1 2 3 4 5 6 7 8; do
            gh pr merge "rollback/${SHA:0:7}" --squash --delete-branch && break
            sleep 5
          done
          gh issue create --title "[DealScope] Data release rolled back (${SHA:0:7})" \
            --body "The post-deploy canary failed, so the release was reverted automatically. Run: ${RUN_URL}" || true
          echo "::error::Release ${SHA:0:7} was rolled back."
          exit 1

      - name: Job summary
        if: always()
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          {
            echo "## Data-bot apply — \`${BRANCH}\`"
            echo ""
            echo "- Pull request: ${PR:-'(none)'}"
            echo "- Validated, auto-merged, canary-checked (rolled back on failure)"
          } >> "$GITHUB_STEP_SUMMARY"
