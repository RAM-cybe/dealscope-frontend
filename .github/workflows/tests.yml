name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'price-refresh/') && !startsWith(github.head_ref, 'price-sync/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install -g pnpm && pnpm install --frozen-lockfile

      - name: Data validator and canary tests
        run: python3 scripts/test_validate_data.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
